Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "lib/tether/protocol/parser.rb"

Metrics/ClassLength:
  Max: 400
  Exclude:
    - "lib/tether/protocol/parser.rb"
    - "lib/tether/protocol/headers.rb"
    - "lib/tether/client.rb"

Metrics/AbcSize:
  Max: 30
  Exclude:
    - "lib/tether/protocol/parser.rb"

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "lib/tether/protocol/parser.rb"

Metrics/ParameterLists:
  Max: 7
  CountKeywordArgs: false

Style/Documentation:
  Enabled: true

AllCops:
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  NewCops: enable

Naming/PredicateMethod:
  Enabled: false

# Parser#run is one deliberately inlined hot loop. Splitting it back into
# helpers measured 6% slower, and hoisting the buffer into locals is the
# single largest win in the parser; see tmp/tether-vs-nats-pure.md.
Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - "lib/tether/protocol/parser.rb"

Metrics/PerceivedComplexity:
  Max: 10
  Exclude:
    - "lib/tether/protocol/parser.rb"

# Anonymous forwarding erases the parameter and block names the YARD docs and
# the RBS signatures refer to, on methods that are public API.
Style/ArgumentsForwarding:
  Enabled: false

Naming/BlockForwarding:
  Enabled: false

Metrics/ModuleLength:
  Max: 400
